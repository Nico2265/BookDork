# =============================================================================
# docker-compose.yml — Orquestación de servicios BookDork
# =============================================================================
# Servicios:
#   • meilisearch  — Motor de búsqueda local (puerto 7700)
#   • bookdork     — Backend FastAPI con HTTP/3 (puerto 8443)
#
# Uso:
#   docker compose up -d          # Arrancar en segundo plano
#   docker compose logs -f        # Ver logs en tiempo real
#   docker compose down           # Detener y eliminar contenedores
# =============================================================================

version: '3.9'

services:

  # ── Meilisearch ─────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.11.3
    container_name: bookdork-meilisearch
    restart: unless-stopped
    environment:
      # Clave maestra — cambiar en producción
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-changeme_strong_master_key}"
      # Ruta de almacenamiento interno
      MEILI_DB_PATH: /meili_data
      # Desactivar telemetría (privacidad)
      MEILI_NO_ANALYTICS: "true"
      # Log level: trace, debug, info, warn, error
      MEILI_LOG_LEVEL: "info"
    ports:
      # Solo exponer en localhost — nunca públicamente en producción
      - "127.0.0.1:7700:7700"
    volumes:
      # Persistencia de datos del índice
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Limitar recursos (ajustar según disponibilidad del servidor)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ── BookDork Backend ─────────────────────────────────────────────────────────
  bookdork:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookdork-backend
    restart: unless-stopped
    environment:
      # Heredar del .env o usar valores por defecto
      APP_NAME: "${APP_NAME:-BookDork Search Engine}"
      DEBUG: "${DEBUG:-false}"
      MEILI_HOST: "http://meilisearch:7700"  # Nombre del servicio Docker
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-changeme_strong_master_key}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-changeme_admin_api_key}"
      TLS_CERT_FILE: "/app/certs/server.crt"
      TLS_KEY_FILE: "/app/certs/server.key"
      HTTP3_PORT: "8443"
    ports:
      # HTTP/3 (QUIC/UDP) + HTTPS (TCP) en el mismo puerto
      - "8443:8443/tcp"
      - "8443:8443/udp"
    volumes:
      # Certificados TLS (generar antes de arrancar)
      - ./certs:/app/certs:ro
      # Frontend estático
      - ./frontend:/app/frontend:ro
    depends_on:
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ── Volúmenes persistentes ───────────────────────────────────────────────────
volumes:
  meilisearch_data:
    driver: local

# ── Red interna ─────────────────────────────────────────────────────────────
networks:
  default:
    name: bookdork-net
    driver: bridge
