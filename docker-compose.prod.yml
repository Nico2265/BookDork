version: '3.9'

services:

  meilisearch:
    image: getmeili/meilisearch:v1.11.3
    container_name: bookdork-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      MEILI_DB_PATH: /meili_data
      MEILI_NO_ANALYTICS: "true"
      MEILI_LOG_LEVEL: "warn"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  bookdork:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookdork-backend
    restart: unless-stopped
    environment:
      DEBUG: "false"
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      ADMIN_API_KEY: "${ADMIN_API_KEY}"
      HTTP3_PORT: "8000"
      APP_DOMAIN: "${APP_DOMAIN}"
    depends_on:
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: bookdork-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: "${APP_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bookdork:
        condition: service_healthy

volumes:
  meilisearch_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  default:
    name: bookdork-prod
    driver: bridge
